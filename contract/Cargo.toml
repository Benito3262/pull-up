[package]
name = "pull-up"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Trex <Benito3262>"]
description = "Pull Up — event deposit kickback on NEAR"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5", features = ["legacy"] }
borsh = "1.5"

[dev-dependencies]
near-sdk = { version = "5.5", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
